name: Claude review

# OFF BY DEFAULT. This workflow only runs when it is started by hand from the
# Actions tab, and it exits early unless the ANTHROPIC_API_KEY secret exists.
#
# Why not on every pull request:
#   - it costs money per run, unlike the deterministic gate in ci.yml
#   - it is non-deterministic, so a required check built on it would sometimes
#     block a correct PR and sometimes wave through a broken one
#   - the deterministic gate must stay the thing that can fail a merge
#
# To turn it on:
#   1. Add ANTHROPIC_API_KEY under Settings -> Secrets and variables -> Actions.
#   2. Run it from the Actions tab against a branch, and read a few reports.
#   3. Only once the reports are consistently useful, consider adding
#      `pull_request:` to the trigger below - and even then keep it advisory,
#      never a required check.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to diff against"
        type: string
        default: main

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Invariant review
    runs-on: ubuntu-latest
    steps:
      - name: Check for API key
        id: guard
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY is not set - skipping. See the header of this file."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.enabled == 'true'
        with:
          # The agent diffs against the base ref, so it needs real history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Claude Code
        if: steps.guard.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Headless run. Three things make this safe to run unattended:
      #   --permission-mode plan   the agent cannot write files or mutate state
      #   --allowedTools           an explicit read-only tool list
      #   --max-turns              a hard ceiling on the agentic loop
      # The repo's own PreToolUse guard hook still applies on top of all three.
      - name: Run invariant review
        if: steps.guard.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Review the diff between ${{ inputs.base }} and HEAD using the invariant-check agent. Report findings only. If nothing violates an invariant, say so in one line." \
            --permission-mode plan \
            --allowedTools "Read,Grep,Glob,Bash(git diff *),Bash(git log *),Bash(git show *)" \
            --max-turns 30 \
            --output-format json \
            > review.json

      - name: Render report
        if: steps.guard.outputs.enabled == 'true'
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("review.json", "utf8"));
            const text = r.result ?? JSON.stringify(r, null, 2);
            require("fs").writeFileSync(process.env.GITHUB_STEP_SUMMARY, text);
            console.log(text);
          '

      - name: Upload raw output
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: claude-review
          path: review.json
          retention-days: 7

    # Deliberately no failure condition. This job reports; it never blocks a
    # merge. The gate that can fail a merge is ci.yml, which is deterministic.
