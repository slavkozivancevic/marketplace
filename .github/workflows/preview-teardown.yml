name: PR Preview Teardown

# Removes the ephemeral pr-<n> stage when its pull request closes (merged or
# not), so preview infra never lingers. Same OIDC role as preview.yml.

on:
  pull_request:
    types: [closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  remove:
    # Mirrors preview.yml's opt-in gate: nothing was deployed for an unlabeled
    # PR, so there is nothing to remove.
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Remove preview stage
        run: npx sst remove --stage "pr-${{ github.event.number }}"
