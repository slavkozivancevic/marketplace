version: 0.2

# AWS CodeBuild spec: builds + deploys the marketplace app via SST (OpenNext).
#
# The CodePipeline stage injects STAGE (staging | production). CodeBuild runs
# under an IAM role assumed by the project - NO static AWS keys. Per-stage
# secrets already live in SST/SSM (set with `sst secret set ...`), so nothing
# sensitive is passed through here.

env:
  variables:
    # Deploy builds only have secrets + resource links, not the full local env,
    # so skip the zod env validation at build time (runtime still has each var).
    SKIP_ENV_VALIDATION: "1"
  # STAGE is set by the pipeline stage (staging/production).

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci

  pre_build:
    commands:
      # Prisma client is generated into src/generated/prisma (custom output).
      - npx prisma generate

  build:
    commands:
      # Migrations. `sst shell -- prisma migrate deploy` looked right but never
      # actually applied anything: SST only exposes linked secrets through
      # SST_RESOURCES_JSON, not as a raw DATABASE_URL env var, so the migrate
      # step here always failed with DATABASE_URL unset (swallowed by the old
      # `|| echo "skipped"` fallback - migrations were always applied by hand).
      # scripts/migrate-stage.mjs reads the DatabaseUrl secret directly (via
      # `sst secret list`) and swaps in the direct (non-pooled) endpoint -
      # Prisma's migration engine needs a session-level connection, which the
      # pgbouncer/pooler endpoint doesn't support (advisory locks). Fatal on
      # failure (timeout-guarded): a migration that doesn't apply must block
      # the deploy, not silently ship app code against the wrong schema.
      - timeout 120 node scripts/migrate-stage.mjs --stage "$STAGE"
      # Build (OpenNext) + deploy. CodeDeploy handles the canary alias shift +
      # CloudWatch-alarm rollback (configured on the Lambda alias, see DEPLOYMENT.md).
      - npx sst deploy --stage "$STAGE"

artifacts:
  # SST writes stack outputs (site URL, bucket, etc.) - surface them to later
  # pipeline stages (e.g. smoke tests read the deployed URL).
  files:
    - .sst/outputs.json
